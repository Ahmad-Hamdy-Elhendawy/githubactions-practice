name: linux lab

on:
  push:
    branches: [main]

env:
  APP_NAME: medical-rag

jobs: 
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: app name
        run: echo "$APP_NAME"
        
      - name: Who am I?
        run: whoami

      - name: System information
        run: uname -a

      - name: List project files
        run: ls -la