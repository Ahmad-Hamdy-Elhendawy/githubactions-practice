name: multi job

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: build
        run: echo "building rn"


  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "testing rn"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploying rn"